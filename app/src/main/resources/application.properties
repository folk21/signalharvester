micronaut.application.name=signalharvester
micronaut.server.port=${SIGNALHARVESTER_HTTP_PORT:8080}

# Blocking application workflows use Virtual Threads on the Java 21 baseline.
micronaut.executors.blocking.virtual=true

signalharvester.collection.max-concurrency=${SIGNALHARVESTER_COLLECTION_MAX_CONCURRENCY:8}

# Generic external-source HTTP safety and resource limits.
micronaut.http.client.connect-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_CONNECT_TIMEOUT:3s}
micronaut.http.client.read-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_READ_TIMEOUT:10s}
micronaut.http.client.request-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_REQUEST_TIMEOUT:15s}
micronaut.http.client.max-content-length=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONTENT_LENGTH:1048576}
micronaut.http.client.exception-on-error-status=false
micronaut.http.client.follow-redirects=true
micronaut.http.client.max-redirects=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_REDIRECTS:5}
micronaut.http.client.decompression-enabled=true
micronaut.http.client.allow-block-event-loop=false
micronaut.http.client.pool.enabled=true
micronaut.http.client.pool.max-connections=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONNECTIONS:32}
micronaut.http.client.pool.max-pending-acquires=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_PENDING_ACQUIRES:64}
micronaut.http.client.pool.acquire-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_POOL_ACQUIRE_TIMEOUT:2s}
