micronaut.application.name=signalharvester
micronaut.server.port=${SIGNALHARVESTER_HTTP_PORT:8080}

# Blocking application workflows use Virtual Threads on the Java 21 baseline.
micronaut.executors.blocking.virtual=true

signalharvester.collection.max-concurrency=${SIGNALHARVESTER_COLLECTION_MAX_CONCURRENCY:8}

# Generic external-source HTTP safety and resource limits.
micronaut.http.client.connect-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_CONNECT_TIMEOUT:3s}
micronaut.http.client.read-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_READ_TIMEOUT:10s}
micronaut.http.client.request-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_REQUEST_TIMEOUT:15s}
micronaut.http.client.max-content-length=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONTENT_LENGTH:1048576}
micronaut.http.client.follow-redirects=true
micronaut.http.client.max-redirects=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_REDIRECTS:5}
micronaut.http.client.decompression-enabled=true
micronaut.http.client.allow-block-event-loop=false
micronaut.http.client.pool.enabled=true
micronaut.http.client.pool.max-connections=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONNECTIONS:32}
micronaut.http.client.pool.max-pending-acquires=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_PENDING_ACQUIRES:64}
micronaut.http.client.pool.acquire-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_POOL_ACQUIRE_TIMEOUT:2s}

# PostgreSQL-backed application configuration.
datasources.default.url=${SIGNALHARVESTER_DB_URL:`jdbc:postgresql://localhost:5432/signalharvester`}
datasources.default.username=${SIGNALHARVESTER_DB_USERNAME:signalharvester}
datasources.default.password=${SIGNALHARVESTER_DB_PASSWORD:signalharvester}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=${SIGNALHARVESTER_DB_MAX_POOL_SIZE:10}

# Each functional module keeps migrations in its own classpath location.
flyway.datasources.default.enabled=true
flyway.datasources.default.locations[0]=classpath:db/migration/configuration
flyway.datasources.default.locations[1]=classpath:db/migration/analysis
flyway.datasources.default.locations[2]=classpath:db/migration/collection

# Kafka transport for versioned collection integration events.
kafka.bootstrap.servers=${SIGNALHARVESTER_KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
kafka.producers.collection-raw-items.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.collection-raw-items.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.collection-raw-items.acks=all
kafka.producers.collection-raw-items.enable.idempotence=true
signalharvester.kafka.raw-item-discovered-topic=${SIGNALHARVESTER_KAFKA_RAW_ITEM_DISCOVERED_TOPIC:signalharvester.collection.raw-item-discovered.v1}

# Analysis consumes raw discovery bytes and publishes explicit versioned terminal events.
signalharvester.analysis.enabled=${SIGNALHARVESTER_ANALYSIS_ENABLED:true}
signalharvester.analysis.consumer-group=${SIGNALHARVESTER_ANALYSIS_CONSUMER_GROUP:signalharvester-analysis-v1}
kafka.consumers.default.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumers.default.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
signalharvester.kafka.item-analyzed-topic=${SIGNALHARVESTER_KAFKA_ITEM_ANALYZED_TOPIC:signalharvester.analysis.item-analyzed.v1}
signalharvester.kafka.item-rejected-topic=${SIGNALHARVESTER_KAFKA_ITEM_REJECTED_TOPIC:signalharvester.analysis.item-rejected.v1}
kafka.producers.analysis-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.analysis-events.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.analysis-events.acks=all
kafka.producers.analysis-events.enable.idempotence=true

# Temporary global deterministic rules until monitoring profiles own analysis settings.
signalharvester.analysis.keyword-rules.keywords[0]=java
signalharvester.analysis.keyword-rules.keywords[1]=kafka
signalharvester.analysis.keyword-rules.keywords[2]=postgresql
signalharvester.analysis.keyword-rules.keywords[3]=backend
signalharvester.analysis.keyword-rules.keywords[4]=artificial intelligence
signalharvester.analysis.keyword-rules.keywords[5]=machine learning
signalharvester.analysis.keyword-rules.minimum-matches=${SIGNALHARVESTER_ANALYSIS_MINIMUM_KEYWORD_MATCHES:1}
