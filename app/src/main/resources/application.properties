micronaut.application.name=signalharvester
micronaut.server.port=${SIGNALHARVESTER_HTTP_PORT:8080}

# Blocking application workflows use Virtual Threads on the Java 21 baseline.
micronaut.executors.blocking.virtual=true

signalharvester.collection.max-concurrency=${SIGNALHARVESTER_COLLECTION_MAX_CONCURRENCY:8}
signalharvester.collection.rss.max-items-per-source=${SIGNALHARVESTER_COLLECTION_RSS_MAX_ITEMS_PER_SOURCE:500}
signalharvester.collection.extraction.max-items-per-source=${SIGNALHARVESTER_COLLECTION_EXTRACTION_MAX_ITEMS_PER_SOURCE:500}
signalharvester.collection.source-test.max-preview-items=${SIGNALHARVESTER_COLLECTION_SOURCE_TEST_MAX_PREVIEW_ITEMS:5}
signalharvester.collection.source-test.max-preview-content-chars=${SIGNALHARVESTER_COLLECTION_SOURCE_TEST_MAX_PREVIEW_CONTENT_CHARS:500}

# Persisted monitoring-profile scheduling.
signalharvester.collection.scheduler.enabled=${SIGNALHARVESTER_COLLECTION_SCHEDULER_ENABLED:true}
signalharvester.collection.scheduler.poll-interval=${SIGNALHARVESTER_COLLECTION_SCHEDULER_POLL_INTERVAL:10s}
signalharvester.collection.scheduler.initial-delay=${SIGNALHARVESTER_COLLECTION_SCHEDULER_INITIAL_DELAY:10s}
signalharvester.collection.scheduler.lease-duration=${SIGNALHARVESTER_COLLECTION_SCHEDULER_LEASE_DURATION:2m}
signalharvester.collection.scheduler.heartbeat-interval=${SIGNALHARVESTER_COLLECTION_SCHEDULER_HEARTBEAT_INTERVAL:30s}

# Generic external-source HTTP safety and resource limits.
micronaut.http.client.connect-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_CONNECT_TIMEOUT:3s}
micronaut.http.client.read-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_READ_TIMEOUT:10s}
micronaut.http.client.request-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_REQUEST_TIMEOUT:15s}
micronaut.http.client.max-content-length=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONTENT_LENGTH:1048576}
micronaut.http.client.follow-redirects=true
micronaut.http.client.max-redirects=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_REDIRECTS:5}
micronaut.http.client.decompression-enabled=true
micronaut.http.client.allow-block-event-loop=false
micronaut.http.client.pool.enabled=true
micronaut.http.client.pool.max-connections=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_CONNECTIONS:32}
micronaut.http.client.pool.max-pending-acquires=${SIGNALHARVESTER_COLLECTION_HTTP_MAX_PENDING_ACQUIRES:64}
micronaut.http.client.pool.acquire-timeout=${SIGNALHARVESTER_COLLECTION_HTTP_POOL_ACQUIRE_TIMEOUT:2s}

# PostgreSQL-backed application configuration.
datasources.default.url=${SIGNALHARVESTER_DB_URL:`jdbc:postgresql://localhost:5432/signalharvester`}
datasources.default.username=${SIGNALHARVESTER_DB_USERNAME:signalharvester}
datasources.default.password=${SIGNALHARVESTER_DB_PASSWORD:signalharvester}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.maximum-pool-size=${SIGNALHARVESTER_DB_MAX_POOL_SIZE:10}

# Each functional module keeps migrations in its own classpath location.
flyway.datasources.default.enabled=true
flyway.datasources.default.locations[0]=classpath:db/migration/configuration
flyway.datasources.default.locations[1]=classpath:db/migration/analysis
flyway.datasources.default.locations[2]=classpath:db/migration/collection
flyway.datasources.default.locations[3]=classpath:db/migration/results
flyway.datasources.default.locations[4]=classpath:db/migration/event_observation

# Kafka transport for versioned collection integration events.
kafka.bootstrap.servers=${SIGNALHARVESTER_KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
kafka.producers.collection-raw-items.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.collection-raw-items.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.collection-raw-items.acks=all
kafka.producers.collection-raw-items.enable.idempotence=true
signalharvester.kafka.raw-item-discovered-topic=${SIGNALHARVESTER_KAFKA_RAW_ITEM_DISCOVERED_TOPIC:signalharvester.collection.raw-item-discovered.v1}

# Analysis consumes raw discovery bytes and publishes explicit versioned terminal events.
signalharvester.analysis.enabled=${SIGNALHARVESTER_ANALYSIS_ENABLED:true}
signalharvester.analysis.consumer-group=${SIGNALHARVESTER_ANALYSIS_CONSUMER_GROUP:signalharvester-analysis-v1}
signalharvester.analysis.kafka-reliability.max-attempts=${SIGNALHARVESTER_ANALYSIS_KAFKA_MAX_ATTEMPTS:3}
signalharvester.analysis.kafka-reliability.retry-backoff=${SIGNALHARVESTER_ANALYSIS_KAFKA_RETRY_BACKOFF:250ms}
signalharvester.analysis.kafka-reliability.dead-letter-topic=${SIGNALHARVESTER_ANALYSIS_DEAD_LETTER_TOPIC:signalharvester.analysis.raw-item-dead-letter.v1}
kafka.consumers.default.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumers.default.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
signalharvester.kafka.item-analyzed-topic=${SIGNALHARVESTER_KAFKA_ITEM_ANALYZED_TOPIC:signalharvester.analysis.item-analyzed.v1}
signalharvester.kafka.item-rejected-topic=${SIGNALHARVESTER_KAFKA_ITEM_REJECTED_TOPIC:signalharvester.analysis.item-rejected.v1}
kafka.producers.analysis-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.analysis-events.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.analysis-events.acks=all
kafka.producers.analysis-events.enable.idempotence=true
kafka.producers.analysis-dead-letter.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.analysis-dead-letter.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.analysis-dead-letter.acks=all
kafka.producers.analysis-dead-letter.enable.idempotence=true

# Results materializes terminal Analysis events into an idempotent PostgreSQL read model.
signalharvester.results.enabled=${SIGNALHARVESTER_RESULTS_ENABLED:true}
signalharvester.results.consumer-group=${SIGNALHARVESTER_RESULTS_CONSUMER_GROUP:signalharvester-results-v1}
signalharvester.results.kafka-reliability.max-attempts=${SIGNALHARVESTER_RESULTS_KAFKA_MAX_ATTEMPTS:3}
signalharvester.results.kafka-reliability.retry-backoff=${SIGNALHARVESTER_RESULTS_KAFKA_RETRY_BACKOFF:250ms}
signalharvester.results.kafka-reliability.dead-letter-topic=${SIGNALHARVESTER_RESULTS_DEAD_LETTER_TOPIC:signalharvester.results.analysis-outcome-dead-letter.v1}
kafka.producers.results-dead-letter.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.results-dead-letter.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.results-dead-letter.acks=all
kafka.producers.results-dead-letter.enable.idempotence=true
signalharvester.results.sse.poll-interval=${SIGNALHARVESTER_RESULTS_SSE_POLL_INTERVAL:1s}
signalharvester.results.sse.keepalive-interval=${SIGNALHARVESTER_RESULTS_SSE_KEEPALIVE_INTERVAL:15s}
signalharvester.results.sse.reconnect-delay=${SIGNALHARVESTER_RESULTS_SSE_RECONNECT_DELAY:2s}
signalharvester.results.sse.batch-size=${SIGNALHARVESTER_RESULTS_SSE_BATCH_SIZE:100}

signalharvester.event-observation.enabled=${SIGNALHARVESTER_EVENT_OBSERVATION_ENABLED:true}
signalharvester.event-observation.consumer-group=${SIGNALHARVESTER_EVENT_OBSERVATION_CONSUMER_GROUP:signalharvester-event-observation-v1}
signalharvester.event-observation.kafka-reliability.max-attempts=${SIGNALHARVESTER_EVENT_OBSERVATION_KAFKA_MAX_ATTEMPTS:3}
signalharvester.event-observation.kafka-reliability.retry-backoff=${SIGNALHARVESTER_EVENT_OBSERVATION_KAFKA_RETRY_BACKOFF:250ms}
signalharvester.event-observation.kafka-reliability.dead-letter-topic=${SIGNALHARVESTER_EVENT_OBSERVATION_DEAD_LETTER_TOPIC:signalharvester.event-observation.dead-letter.v1}
kafka.producers.event-observation-dead-letter.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producers.event-observation-dead-letter.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.producers.event-observation-dead-letter.acks=all
kafka.producers.event-observation-dead-letter.enable.idempotence=true
signalharvester.event-observation.retention.max-events=${SIGNALHARVESTER_EVENT_OBSERVATION_MAX_EVENTS:10000}
signalharvester.event-observation.retention.max-age=${SIGNALHARVESTER_EVENT_OBSERVATION_MAX_AGE:24h}
signalharvester.event-observation.sse.poll-interval=${SIGNALHARVESTER_EVENT_OBSERVATION_SSE_POLL_INTERVAL:1s}
signalharvester.event-observation.sse.keepalive-interval=${SIGNALHARVESTER_EVENT_OBSERVATION_SSE_KEEPALIVE_INTERVAL:15s}
signalharvester.event-observation.sse.reconnect-delay=${SIGNALHARVESTER_EVENT_OBSERVATION_SSE_RECONNECT_DELAY:2s}
signalharvester.event-observation.sse.batch-size=${SIGNALHARVESTER_EVENT_OBSERVATION_SSE_BATCH_SIZE:200}

# Temporary global deterministic rules until monitoring profiles own analysis settings.
signalharvester.analysis.keyword-rules.keywords[0]=java
signalharvester.analysis.keyword-rules.keywords[1]=kafka
signalharvester.analysis.keyword-rules.keywords[2]=postgresql
signalharvester.analysis.keyword-rules.keywords[3]=backend
signalharvester.analysis.keyword-rules.keywords[4]=artificial intelligence
signalharvester.analysis.keyword-rules.keywords[5]=machine learning
signalharvester.analysis.keyword-rules.minimum-matches=${SIGNALHARVESTER_ANALYSIS_MINIMUM_KEYWORD_MATCHES:1}

# Analysis transactional outbox delivery. Database state and serialized terminal events commit atomically;
# Kafka publication is lease-driven outside the database transaction and may repeat with the same event id.
signalharvester.analysis.outbox.enabled=${SIGNALHARVESTER_ANALYSIS_OUTBOX_ENABLED:true}
signalharvester.analysis.outbox.poll-interval=${SIGNALHARVESTER_ANALYSIS_OUTBOX_POLL_INTERVAL:1s}
signalharvester.analysis.outbox.batch-size=${SIGNALHARVESTER_ANALYSIS_OUTBOX_BATCH_SIZE:100}
signalharvester.analysis.outbox.lease-duration=${SIGNALHARVESTER_ANALYSIS_OUTBOX_LEASE_DURATION:30s}
signalharvester.analysis.outbox.retry-backoff=${SIGNALHARVESTER_ANALYSIS_OUTBOX_RETRY_BACKOFF:2s}

# Application observability. Prometheus scraping and health probes are local operational endpoints;
# trace export is disabled by default until an OTLP collector is configured.
micronaut.metrics.enabled=${SIGNALHARVESTER_METRICS_ENABLED:true}
micronaut.metrics.export.prometheus.enabled=${SIGNALHARVESTER_PROMETHEUS_ENABLED:true}
micronaut.metrics.export.prometheus.descriptions=true
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.prometheus.enabled=true
endpoints.prometheus.sensitive=false
otel.traces.exporter=${SIGNALHARVESTER_OTEL_TRACES_EXPORTER:none}
otel.exporter.otlp.endpoint=${SIGNALHARVESTER_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.propagators=tracecontext,baggage
otel.exclusions[0]=/health.*
otel.exclusions[1]=/prometheus
