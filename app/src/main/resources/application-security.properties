# Activate with MICRONAUT_ENVIRONMENTS=security. Signing and CSRF secrets have no repository defaults.
micronaut.security.enabled=true
micronaut.security.authentication=cookie
micronaut.security.redirect.enabled=false
micronaut.security.reject-not-found=false
micronaut.security.basic-auth.enabled=false

micronaut.security.endpoints.login.enabled=true
micronaut.security.endpoints.login.path=/api/v1/auth/login
# SignalHarvester owns /api/v1/auth/logout so its cookie-clearing contract stays explicit.
micronaut.security.endpoints.logout.enabled=false

micronaut.security.token.generator.access-token.expiration=${SIGNALHARVESTER_JWT_TTL_SECONDS:900}
micronaut.security.token.jwt.signatures.secret.generator.secret=${SIGNALHARVESTER_JWT_SECRET}
micronaut.security.token.jwt.signatures.secret.generator.jws-algorithm=HS256
micronaut.security.token.jwt.claims-validators.issuer=signalharvester
micronaut.security.token.jwt.claims-validators.audience=${SIGNALHARVESTER_JWT_AUDIENCE:signalharvester-api}
micronaut.security.token.cookie.enabled=true
micronaut.security.token.cookie.cookie-name=SIGNALHARVESTER_AUTH
micronaut.security.token.cookie.cookie-http-only=true
micronaut.security.token.cookie.cookie-secure=${SIGNALHARVESTER_AUTH_COOKIE_SECURE:false}
micronaut.security.token.cookie.cookie-same-site=Strict
micronaut.security.token.cookie.cookie-path=/
micronaut.security.token.cookie.cookie-max-age=${SIGNALHARVESTER_AUTH_COOKIE_MAX_AGE:15m}
micronaut.security.token.bearer.enabled=true
signalharvester.security.jwt.audience=${SIGNALHARVESTER_JWT_AUDIENCE:signalharvester-api}

# Stateless signed double-submit CSRF token. JavaScript reads only this CSRF cookie, never the JWT cookie.
micronaut.security.csrf.enabled=true
micronaut.security.csrf.signature-key=${SIGNALHARVESTER_CSRF_SECRET}
micronaut.security.csrf.cookie-name=XSRF-TOKEN
micronaut.security.csrf.cookie-http-only=false
micronaut.security.csrf.cookie-secure=${SIGNALHARVESTER_AUTH_COOKIE_SECURE:false}
micronaut.security.csrf.cookie-same-site=Strict
micronaut.security.csrf.cookie-path=/
micronaut.security.csrf.header-name=X-CSRF-TOKEN
micronaut.security.csrf.filter.regex-pattern=^(?!/api/v1/auth/login$).*$
micronaut.security.csrf.filter.content-types[0]=application/json
micronaut.security.csrf.filter.content-types[1]=application/x-www-form-urlencoded
micronaut.security.csrf.filter.content-types[2]=multipart/form-data

# The first ADMIN is created only when no enabled ADMIN exists and both deployment secrets are supplied.
signalharvester.security.bootstrap.username=${SIGNALHARVESTER_BOOTSTRAP_ADMIN_USERNAME:}
signalharvester.security.bootstrap.password=${SIGNALHARVESTER_BOOTSTRAP_ADMIN_PASSWORD:}
signalharvester.security.password-hashing.iterations=${SIGNALHARVESTER_PASSWORD_HASH_ITERATIONS:600000}

# Same-origin is preferred. Enable this only for an explicitly configured separately hosted frontend origin.
micronaut.server.cors.enabled=${SIGNALHARVESTER_CORS_ENABLED:false}
micronaut.server.cors.configurations.web.allowed-origins[0]=${SIGNALHARVESTER_CORS_ALLOWED_ORIGIN:http://localhost:5173}
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=Content-Type
micronaut.server.cors.configurations.web.allowed-headers[1]=X-CSRF-TOKEN
micronaut.server.cors.configurations.web.allowed-headers[2]=Authorization
micronaut.server.cors.configurations.web.allow-credentials=true

# Endpoint/role matrix. Order matters for patterns without an HTTP method.
micronaut.security.intercept-url-map[0].pattern=/api/v1/auth/login
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/api/v1/auth/logout
micronaut.security.intercept-url-map[1].access[0]=isAuthenticated()
micronaut.security.intercept-url-map[2].pattern=/api/v1/auth/me
micronaut.security.intercept-url-map[2].access[0]=isAuthenticated()
micronaut.security.intercept-url-map[3].pattern=/api/v1/results
micronaut.security.intercept-url-map[3].access[0]=VIEWER
micronaut.security.intercept-url-map[4].pattern=/api/v1/results/**
micronaut.security.intercept-url-map[4].access[0]=VIEWER
micronaut.security.intercept-url-map[5].pattern=/api/v1/admin/users
micronaut.security.intercept-url-map[5].access[0]=ADMIN
micronaut.security.intercept-url-map[6].pattern=/api/v1/admin/users/**
micronaut.security.intercept-url-map[6].access[0]=ADMIN
micronaut.security.intercept-url-map[7].pattern=/api/v1/**
micronaut.security.intercept-url-map[7].access[0]=ADMIN
micronaut.security.intercept-url-map[8].pattern=/health
micronaut.security.intercept-url-map[8].access[0]=isAnonymous()
micronaut.security.intercept-url-map[9].pattern=/health/**
micronaut.security.intercept-url-map[9].access[0]=isAnonymous()
micronaut.security.intercept-url-map[10].pattern=/prometheus
micronaut.security.intercept-url-map[10].access[0]=isAnonymous()
