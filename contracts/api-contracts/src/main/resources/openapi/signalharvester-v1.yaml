openapi: 3.1.0
info:
  title: SignalHarvester Backend API
  version: 0.1.0
  description: Public HTTP contract for SignalHarvester configuration, results, event observation, processing-flow, and operational
    APIs.
tags:
- name: Sources
  description: External source configuration.
- name: Monitoring Profiles
  description: Persisted monitoring-profile configuration.
- name: Collection Runs
  description: Manual collection execution and operational run history.
- name: Analysis Inspection
  description: Read-only operational inspection of analysis deduplication state.
- name: Results
  description: Read-only browsing of durable analyzed results.
- name: Event Observation
  description: Bounded technical event history and live Event Explorer delivery.
- name: Processing Flows
  description: Reconstructed collection-run and item processing graphs for the Event Explorer.
- name: Authentication
  description: Stateless JWT browser authentication and current-principal inspection.
- name: User Administration
  description: ADMIN-only persistent identity and role administration.
- name: Dead Letter Recovery
  description: ADMIN-only inspection and deliberate owner-specific recovery of terminal Kafka consumer failures.
- name: Operational Intelligence
  description: ADMIN-only operational change history and persisted Health Snapshot/report foundation.
security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/v1/sources:
    get:
      tags:
      - Sources
      operationId: listSources
      summary: List configured external sources
      responses:
        '200':
          description: Configured sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      tags:
      - Sources
      operationId: createSource
      summary: Create an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
  /api/v1/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Sources
      operationId: getSource
      summary: Get a configured external source
      responses:
        '200':
          description: Configured source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Source not found
    put:
      tags:
      - Sources
      operationId: updateSource
      summary: Replace an external source configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
        '404':
          description: Source not found
    delete:
      tags:
      - Sources
      operationId: deleteSource
      summary: Delete an external source
      responses:
        '204':
          description: Source deleted
        '404':
          description: Source not found
        '409':
          description: Source is referenced by a monitoring profile
  /api/v1/sources/{sourceId}/test:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    post:
      tags:
      - Sources
      operationId: testSource
      summary: Test one persisted external source configuration
      description: Uses the normal collection fetch and extraction boundary without publishing Kafka events or collection-run history. Disabled sources may be tested before activation.
      responses:
        '200':
          description: Diagnostic source-test result, including fetch or extraction failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTestResult'
        '404':
          description: Source not found
  /api/v1/monitoring-profiles:
    get:
      tags:
      - Monitoring Profiles
      operationId: listMonitoringProfiles
      summary: List monitoring profiles
      responses:
        '200':
          description: Persisted monitoring profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringProfile'
    post:
      tags:
      - Monitoring Profiles
      operationId: createMonitoringProfile
      summary: Create a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '201':
          description: Monitoring profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
  /api/v1/monitoring-profiles/{profileId}:
    parameters:
    - name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Monitoring Profiles
      operationId: getMonitoringProfile
      summary: Get a monitoring profile
      responses:
        '200':
          description: Persisted monitoring profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '404':
          description: Monitoring profile not found
    put:
      tags:
      - Monitoring Profiles
      operationId: updateMonitoringProfile
      summary: Replace a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '200':
          description: Monitoring profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
        '404':
          description: Monitoring profile not found
    delete:
      tags:
      - Monitoring Profiles
      operationId: deleteMonitoringProfile
      summary: Delete a monitoring profile
      responses:
        '204':
          description: Monitoring profile deleted
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs:
    get:
      tags:
      - Collection Runs
      operationId: listCollectionRuns
      summary: List recent completed collection runs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Recent collection runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionRun'
    post:
      tags:
      - Collection Runs
      operationId: startCollectionRun
      summary: Start a manual collection run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRunRequest'
      responses:
        '201':
          description: Completed collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '400':
          description: Invalid run request
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs/{collectionRunId}:
    parameters:
    - name: collectionRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Collection Runs
      operationId: getCollectionRun
      summary: Get one completed collection run
      responses:
        '200':
          description: Collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '404':
          description: Collection run not found
  /api/v1/admin/analysis/items:
    get:
      tags:
      - Analysis Inspection
      operationId: listAnalysisItems
      summary: List recent normalized analysis items
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisItemInspection'
  /api/v1/admin/analysis/items/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Analysis Inspection
      operationId: getAnalysisItem
      summary: Get one profile-scoped normalized analysis item
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisItemInspection'
        '404':
          description: Analysis item not found
  /api/v1/events:
    get:
      tags:
      - Event Observation
      operationId: listObservedEvents
      summary: List recent technical processing events
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: eventType
        in: query
        schema:
          type: string
      - name: producer
        in: query
        schema:
          type: string
      - name: topic
        in: query
        schema:
          type: string
      - name: correlationId
        in: query
        schema:
          type: string
      - name: collectionRunId
        in: query
        description: Alias for the current pipeline correlation identifier.
        schema:
          type: string
      - name: itemId
        in: query
        description: Matches either rawItemId or normalizedItemId.
        schema:
          type: string
      - name: traceId
        in: query
        description: W3C trace id matched inside traceparent when present.
        schema:
          type: string
      responses:
        '200':
          description: Recent observed events matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservedEvent'
        '400':
          description: Invalid event-observation query parameters
  /api/v1/events/stream:
    get:
      tags:
      - Event Observation
      operationId: streamObservedEvents
      summary: Stream live technical processing events
      description: >-
        Server-Sent Events stream over the bounded persisted Event Explorer history. The server emits
        named `ready`, `event`, and `keepalive` events with numeric durable cursors. Browser reconnection
        may resume with Last-Event-ID. A fresh connection starts after the current cursor; use
        GET /api/v1/events for an initial bounded history snapshot. For a race-free browser bootstrap,
        establish the stream and receive `ready` before fetching GET /api/v1/events, buffering later `event`
        messages until the REST snapshot has been applied. History retention is bounded, so a reconnect
        cursor older than retained records resumes with the oldest still-retained matching events.
      parameters:
      - name: eventType
        in: query
        schema:
          type: string
      - name: producer
        in: query
        schema:
          type: string
      - name: topic
        in: query
        schema:
          type: string
      - name: correlationId
        in: query
        schema:
          type: string
      - name: collectionRunId
        in: query
        schema:
          type: string
      - name: itemId
        in: query
        schema:
          type: string
      - name: traceId
        in: query
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resumable live technical-event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ObservedEventLiveEvent'
        '400':
          description: Invalid filters or Last-Event-ID cursor
  /api/v1/flows/collection-runs/{collectionRunId}:
    get:
      tags:
      - Processing Flows
      operationId: getCollectionRunProcessingFlow
      summary: Reconstruct a processing graph for one collection run
      description: >-
        Builds a bounded diagnostic graph from retained Event Observation history. Each node states whether
        its evidence is directly observed, derived from a published event, or currently not observed.
      parameters:
      - name: collectionRunId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Reconstructed collection-run processing graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingFlow'
        '404':
          description: No retained technical events exist for the collection run
  /api/v1/flows/collection-runs/{collectionRunId}/items/{itemId}:
    get:
      tags:
      - Processing Flows
      operationId: getItemProcessingFlow
      summary: Reconstruct one item branch within a collection run
      description: >-
        The item identifier may be a raw or normalized item id. Collection-run scoping prevents repeated
        logical items from different runs from being merged into one graph.
      parameters:
      - name: collectionRunId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Reconstructed item processing graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingFlow'
        '404':
          description: No retained technical events exist for the selected item in the collection run
  /api/v1/results:
    get:
      tags:
      - Results
      operationId: listResults
      summary: Browse analyzed results
      parameters:
      - name: cursor
        in: query
        description: Opaque keyset cursor returned in the previous response X-Next-Cursor header.
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - name: search
        in: query
        description: PostgreSQL web-style full-text search over result title and normalized content.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      - name: informationCategory
        in: query
        schema:
          type: string
      - name: relevant
        in: query
        schema:
          type: boolean
      - name: classification
        in: query
        schema:
          type: string
      - name: analyzedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: analyzedTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Analyzed results matching the supplied filters, search expression, and optional keyset cursor
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page. Absent when the returned page is final.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultSummary'
        '400':
          description: Invalid result query parameters
  /api/v1/results/stream:
    get:
      tags:
      - Results
      operationId: streamResults
      summary: Stream live analyzed-result updates
      description: >-
        Server-Sent Events stream. The server emits named `ready`, `result`, and `keepalive`
        events. Each event has a numeric `id` cursor and a JSON `data` payload matching
        ResultLiveEvent. Browser EventSource reconnection resumes from the automatically
        supplied Last-Event-ID header. A connection without Last-Event-ID starts after the
        current durable cursor; clients should use GET /api/v1/results for initial browsing.
        The stream represents current result projections rather than an append-only event history,
        so repeated updates to one logical result while disconnected may collapse to the latest
        current projection. A resume cursor ahead of the current database watermark is normalized
        back to that watermark. For a race-free initial page load, establish the stream and receive
        `ready` before fetching GET /api/v1/results, buffering later `result` events until the REST
        snapshot has been applied.
      parameters:
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      - name: informationCategory
        in: query
        schema:
          type: string
      - name: relevant
        in: query
        schema:
          type: boolean
      - name: classification
        in: query
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        description: Last numeric SSE cursor received by the client.
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resumable live result stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ResultLiveEvent'
        '400':
          description: Invalid filters or Last-Event-ID cursor
  /api/v1/results/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Results
      operationId: getResult
      summary: Get one profile-scoped analyzed result
      responses:
        '200':
          description: Detailed analyzed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDetail'
        '400':
          description: Invalid result identity
        '404':
          description: Result not found
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate with username and password
      description: On success the backend sets an HttpOnly JWT cookie and a readable signed CSRF cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded and browser credentials were set
        '401':
          description: Invalid credentials or disabled account
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Clear browser authentication credentials
      responses:
        '200':
          description: Browser authentication cookie cleared
        '401':
          description: Authentication required
        '403':
          description: CSRF validation failed
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentPrincipal
      summary: Get the current authenticated principal
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPrincipal'
        '401':
          description: Authentication required
  /api/v1/admin/analysis/dead-letters/{partition}/{offset}:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    get:
      tags: [Dead Letter Recovery]
      operationId: inspectAnalysisDeadLetter
      summary: Inspect one Analysis dead-letter record
      description: Reads one real Analysis DLQ record by Kafka position without exposing its serialized source payload.
      responses:
        '200':
          description: Sanitized Analysis dead-letter metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required }
        '404': { description: DLQ record not found }
        '422': { description: DLQ record is invalid for Analysis recovery }
        '429': { description: Analysis recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/analysis/dead-letters/{partition}/{offset}/replay:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    post:
      tags: [Dead Letter Recovery]
      operationId: replayAnalysisDeadLetter
      summary: Replay one confirmed Analysis dead-letter record
      description: Reprocesses the stored original key and payload through the Analysis-owned decoder/application path without republishing the shared source event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadLetterReplayRequest'
      responses:
        '200':
          description: Sanitized metadata for the replayed Analysis dead-letter record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid request or DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required or CSRF validation failed }
        '404': { description: DLQ record not found }
        '409': { description: Confirmation mismatch or Analysis replay failed }
        '422': { description: DLQ record or stored source record is invalid for Analysis recovery }
        '429': { description: Analysis recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/results/dead-letters/{partition}/{offset}:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    get:
      tags: [Dead Letter Recovery]
      operationId: inspectResultsDeadLetter
      summary: Inspect one Results dead-letter record
      description: Reads one real Results DLQ record by Kafka position without exposing its serialized source payload.
      responses:
        '200':
          description: Sanitized Results dead-letter metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required }
        '404': { description: DLQ record not found }
        '422': { description: DLQ record is invalid for Results recovery }
        '429': { description: Results recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/results/dead-letters/{partition}/{offset}/replay:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    post:
      tags: [Dead Letter Recovery]
      operationId: replayResultsDeadLetter
      summary: Replay one confirmed Results dead-letter record
      description: Reprojects the stored original key and payload through the Results-owned decoder/application path without republishing the shared Analysis event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadLetterReplayRequest'
      responses:
        '200':
          description: Sanitized metadata for the replayed Results dead-letter record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid request or DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required or CSRF validation failed }
        '404': { description: DLQ record not found }
        '409': { description: Confirmation mismatch or Results replay failed }
        '422': { description: DLQ record or stored source record is invalid for Results recovery }
        '429': { description: Results recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/event-observation/dead-letters/{partition}/{offset}:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    get:
      tags: [Dead Letter Recovery]
      operationId: inspectEventObservationDeadLetter
      summary: Inspect one Event Observation dead-letter record
      description: Reads one real Event Observation DLQ record by Kafka position without exposing its serialized source payload.
      responses:
        '200':
          description: Sanitized Event Observation dead-letter metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required }
        '404': { description: DLQ record not found }
        '422': { description: DLQ record is invalid for Event Observation recovery }
        '429': { description: Event Observation recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/event-observation/dead-letters/{partition}/{offset}/replay:
    parameters:
    - $ref: '#/components/parameters/DeadLetterPartition'
    - $ref: '#/components/parameters/DeadLetterOffset'
    post:
      tags: [Dead Letter Recovery]
      operationId: replayEventObservationDeadLetter
      summary: Replay one confirmed Event Observation dead-letter record
      description: Re-records the stored original key and payload through Event Observation only, preserving original source transport metadata and without republishing the shared source event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadLetterReplayRequest'
      responses:
        '200':
          description: Sanitized metadata for the replayed Event Observation dead-letter record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterInspection'
        '400': { description: Invalid request or DLQ position }
        '401': { description: Authentication required }
        '403': { description: ADMIN role required or CSRF validation failed }
        '404': { description: DLQ record not found }
        '409': { description: Confirmation mismatch or Event Observation replay failed }
        '422': { description: DLQ record or stored source record is invalid for Event Observation recovery }
        '429': { description: Event Observation recovery concurrency limit reached }
        '503': { description: Kafka unavailable }
  /api/v1/admin/operations/changes:
    get:
      tags: [Operational Intelligence]
      operationId: listOperationalChanges
      summary: List recent sanitized operational changes
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Recent operational changes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OperationalChange'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
  /api/v1/admin/operations/changes/markers:
    post:
      tags: [Operational Intelligence]
      operationId: createOperationalMarker
      summary: Record a bounded operational tooling or scenario marker
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationalMarkerRequest'}
      responses:
        '201':
          description: Operational marker recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationalChange'}
        '400': {description: Invalid or unsafe operational marker}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required or CSRF validation failed}
  /api/v1/admin/operations/health/snapshots:
    post:
      tags: [Operational Intelligence]
      operationId: captureHealthSnapshot
      summary: Capture the current deterministic/statistical Health Snapshot
      responses:
        '201':
          description: Persisted Health Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthSnapshot'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required or CSRF validation failed}
  /api/v1/admin/operations/health/snapshots/latest:
    get:
      tags: [Operational Intelligence]
      operationId: getLatestHealthSnapshot
      summary: Return the latest persisted Health Snapshot
      responses:
        '200':
          description: Latest Health Snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthSnapshot'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
        '404': {description: No Health Snapshot has been captured yet}
  /api/v1/admin/operations/health/reports/latest:
    get:
      tags: [Operational Intelligence]
      operationId: getLatestHealthReport
      summary: Export the latest bounded Health Report as Markdown
      responses:
        '200':
          description: Latest bounded Health Report
          content:
            text/plain:
              schema: {type: string}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
        '404': {description: No Health Snapshot has been captured yet}
  /api/v1/admin/operations/health/analysis-packages/latest:
    get:
      tags: [Operational Intelligence]
      operationId: getLatestHealthAnalysisPackage
      summary: Export a bounded sanitized package for manual or provider-assisted LLM analysis
      responses:
        '200':
          description: Latest bounded assisted-investigation package
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthAnalysisPackage'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
        '404': {description: No Health Snapshot has been captured yet}
  /api/v1/admin/operations/health/assessments:
    get:
      tags: [Operational Intelligence]
      operationId: listIncidentAssessments
      summary: List recent validated incident assessments
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 20}
      responses:
        '200':
          description: Recent structured incident assessments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IncidentAssessment'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
  /api/v1/admin/operations/health/assessments/manual:
    post:
      tags: [Operational Intelligence]
      operationId: submitManualIncidentAssessment
      summary: Persist a validated structured assessment produced from an exported package
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IncidentAssessmentSubmission'}
      responses:
        '201':
          description: Structured assessment persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentAssessment'}
        '400': {description: Invalid assessment or unsupported evidence reference}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required or CSRF validation failed}
        '404': {description: Referenced Health Snapshot not found}
  /api/v1/admin/operations/health/assessments/analyze-latest:
    post:
      tags: [Operational Intelligence]
      operationId: analyzeLatestHealthSnapshot
      summary: Explicitly invoke the configured provider for the latest Health Snapshot
      description: The provider may perform a bounded read-only investigation through application-owned allowlisted tools. It never runs automatically in this stage, and provider output cannot override deterministic health status or score.
      responses:
        '201':
          description: Validated provider assessment persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentAssessment'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required or CSRF validation failed}
        '404': {description: No Health Snapshot has been captured yet}
        '502': {description: Provider transport/protocol/structured-output failure}
        '503': {description: Provider-assisted investigation is disabled or misconfigured}
  /api/v1/admin/operations/changes/{changeId}/health-correlation:
    parameters:
    - name: changeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Operational Intelligence]
      operationId: getOperationalChangeHealthCorrelation
      summary: Return nearest persisted Health Snapshots before and after a change
      responses:
        '200':
          description: Change with nearest before/after snapshots
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationalHealthCorrelation'}
        '401': {description: Authentication required}
        '403': {description: ADMIN role required}
        '404': {description: Operational change not found}
  /api/v1/admin/users:
    get:
      tags:
      - User Administration
      operationId: listUsers
      summary: List persisted application identities
      responses:
        '200':
          description: Persisted identities without credential material
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
    post:
      tags:
      - User Administration
      operationId: createUser
      summary: Create an application identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Identity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid identity configuration
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required or CSRF validation failed
        '409':
          description: Username already exists
  /api/v1/admin/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - User Administration
      operationId: getUser
      summary: Get one persisted application identity
      responses:
        '200':
          description: Persisted identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Identity not found
    put:
      tags:
      - User Administration
      operationId: updateUser
      summary: Replace identity enabled state and role assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Identity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid identity configuration
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required or CSRF validation failed
        '404':
          description: Identity not found
        '409':
          description: Update would leave the deployment without an enabled ADMIN identity
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SIGNALHARVESTER_AUTH
      description: HttpOnly JWT cookie used by browser REST and native EventSource requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer transport for approved non-browser clients.
  parameters:
    DeadLetterPartition:
      name: partition
      in: path
      required: true
      description: Kafka partition of the owner-specific dead-letter topic.
      schema:
        type: integer
        minimum: 0
    DeadLetterOffset:
      name: offset
      in: path
      required: true
      description: Kafka offset of the owner-specific dead-letter topic.
      schema:
        type: integer
        format: int64
        minimum: 0
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Stable source identifier.
      schema:
        type: string
        format: uuid
  schemas:
    DeadLetterReplayRequest:
      type: object
      required: [expectedDeadLetterId]
      properties:
        expectedDeadLetterId:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: .*\S.*
          description: Exact dead-letter identifier returned by inspection and required as an explicit replay confirmation.
    DeadLetterInspection:
      type: object
      required:
      - deadLetterId
      - consumer
      - consumerGroup
      - deadLetterTopic
      - deadLetterPartition
      - deadLetterOffset
      - sourceTopic
      - sourcePartition
      - sourceOffset
      - sourceKey
      - failureType
      - failureMessage
      - attempts
      - retryable
      - sourcePayloadBytes
      properties:
        deadLetterId:
          type: string
        consumer:
          type: string
        consumerGroup:
          type: string
        deadLetterTopic:
          type: string
        deadLetterPartition:
          type: integer
          minimum: 0
        deadLetterOffset:
          type: integer
          format: int64
          minimum: 0
        sourceTopic:
          type: string
        sourcePartition:
          type: integer
          minimum: 0
        sourceOffset:
          type: integer
          format: int64
          minimum: 0
        sourceKey:
          type: string
          description: Original Kafka key, or an empty string when the source record had no usable key.
        failureType:
          type: string
        failureMessage:
          type: string
        attempts:
          type: integer
          minimum: 1
        retryable:
          type: boolean
        sourcePayloadBytes:
          type: integer
          minimum: 0
          description: Serialized source payload size; the payload bytes themselves are never returned by the administrative API.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    UserRole:
      type: string
      enum: [USER, VIEWER, ADMIN, BOT]
    IdentityType:
      type: string
      enum: [HUMAN, BOT]
    CurrentPrincipal:
      type: object
      required: [id, username, identityType, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        identityType:
          $ref: '#/components/schemas/IdentityType'
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
    UserAccount:
      type: object
      required: [id, username, identityType, enabled, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        identityType:
          $ref: '#/components/schemas/IdentityType'
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [username, password, identityType, enabled]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        identityType:
          $ref: '#/components/schemas/IdentityType'
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/UserRole'
    UserUpdateRequest:
      type: object
      required: [enabled, roles]
      properties:
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
    SourceType:
      type: string
      enum:
      - REST
      - RSS
      - HTML
    Source:
      type: object
      required:
      - id
      - name
      - type
      - location
      - enabled
      - settings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
        settings:
          type: object
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceUpsertRequest:
      type: object
      required:
      - name
      - type
      - location
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
          default: false
          description: Whether collection is enabled. Omitted requests default to false.
        settings:
          type: object
          default: {}
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceTestStatus:
      type: string
      enum:
      - SUCCEEDED
      - FETCH_FAILED
      - EXTRACTION_FAILED
    SourceTestPreviewItem:
      type: object
      required:
      - externalId
      - title
      - url
      - contentPreview
      - contentType
      - publishedAt
      - contentTruncated
      properties:
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        contentPreview:
          type: string
          description: Bounded prefix of extracted semantic content.
        contentType:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        contentTruncated:
          type: boolean
    SourceTestResult:
      type: object
      required:
      - sourceId
      - status
      - httpStatus
      - responseContentType
      - responseBytes
      - fetchDurationMs
      - extractionDurationMs
      - candidateItemCount
      - preview
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SourceTestStatus'
        httpStatus:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        responseContentType:
          type:
          - string
          - 'null'
        responseBytes:
          type: integer
          minimum: 0
        fetchDurationMs:
          type: integer
          format: int64
          minimum: 0
        extractionDurationMs:
          type: integer
          format: int64
          minimum: 0
        candidateItemCount:
          type: integer
          minimum: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/SourceTestPreviewItem'
        failureMessage:
          type:
          - string
          - 'null'
    MonitoringProfile:
      type: object
      required:
      - id
      - name
      - informationCategory
      - enabled
      - collectionIntervalMinutes
      - sourceIds
      - criteria
      - analysisSettings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          additionalProperties:
            type: string
        analysisSettings:
          $ref: '#/components/schemas/MonitoringProfileAnalysisSettings'
    MonitoringProfileUpsertRequest:
      type: object
      required:
      - name
      - informationCategory
      - collectionIntervalMinutes
      - sourceIds
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
          default: false
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          default: {}
          additionalProperties:
            type: string
        analysisSettings:
          description: Optional replacement field. Create omission means all analyzed items are relevant; update omission preserves the current effective settings. New clients should round-trip this field.
          $ref: '#/components/schemas/MonitoringProfileAnalysisSettings'
    MonitoringProfileAnalysisSettings:
      type: object
      required:
      - keywords
      - minimumMatches
      properties:
        keywords:
          type: array
          minItems: 0
          uniqueItems: true
          description: Normalized keyword filters. An empty list means all analyzed items are relevant.
          items:
            type: string
            minLength: 1
            pattern: .*\S.*
        minimumMatches:
          type: integer
          minimum: 0
          description: Must be zero when keywords is empty; otherwise must be positive and no greater than the number of unique normalized keywords.
    CollectionRunRequest:
      type: object
      required:
      - monitoringProfileId
      properties:
        monitoringProfileId:
          type: string
          format: uuid
    CollectionSourceRun:
      type: object
      description: One terminal source/item outcome. RSS/Atom sources may contribute multiple outcomes with the same sourceId.
      required:
      - sourceId
      - status
      - rawItemId
      - eventId
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PUBLISHED
          - NO_ITEMS
          - FETCH_FAILED
          - EXTRACTION_FAILED
          - PUBLICATION_FAILED
        rawItemId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        failureMessage:
          type:
          - string
          - 'null'
    CollectionRun:
      type: object
      required:
      - collectionRunId
      - monitoringProfileId
      - informationCategory
      - startedAt
      - finishedAt
      - status
      - publishedCount
      - failedCount
      - sources
      properties:
        collectionRunId:
          type: string
          format: uuid
        monitoringProfileId:
          type: string
        informationCategory:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
        publishedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of semantic items successfully published to Kafka.
        failedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of fetch, extraction, or item-publication failures.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSourceRun'
    AnalysisItemInspection:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - sourceId
      - externalId
      - sourceUrl
      - firstRawItemId
      - firstSourceEventId
      - firstSeenAt
      - lastRawItemId
      - lastSourceEventId
      - lastSeenAt
      - discoveryCount
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceId:
          type: string
        externalId:
          type:
          - string
          - 'null'
        sourceUrl:
          type: string
          format: uri
        firstRawItemId:
          type: string
        firstSourceEventId:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastRawItemId:
          type: string
        lastSourceEventId:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        discoveryCount:
          type: integer
          format: int64
          minimum: 1

    ObservedKafkaMetadata:
      type: object
      required: [topic, partition, offset, key]
      properties:
        topic:
          type: string
        partition:
          type: integer
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
        key:
          type: string
    ObservedEventPayload:
      type: object
      required:
      - type
      - sourceEventId
      - rawItemId
      - normalizedItemId
      - sourceId
      - monitoringProfileId
      - informationCategory
      - externalId
      - title
      - url
      - contentType
      - relevant
      - classification
      - score
      - analyzer
      - reasonCode
      - explanation
      properties:
        type: {type: string}
        sourceEventId: {type: [string, 'null']}
        rawItemId: {type: [string, 'null']}
        normalizedItemId: {type: [string, 'null']}
        sourceId: {type: [string, 'null']}
        monitoringProfileId: {type: [string, 'null']}
        informationCategory: {type: [string, 'null']}
        externalId: {type: [string, 'null']}
        title: {type: [string, 'null']}
        url: {type: [string, 'null']}
        contentType: {type: [string, 'null']}
        relevant: {type: [boolean, 'null']}
        classification: {type: [string, 'null']}
        score: {type: [integer, 'null']}
        analyzer: {type: [string, 'null']}
        reasonCode: {type: [string, 'null']}
        explanation: {type: [string, 'null']}
    ObservedEvent:
      type: object
      required:
      - cursor
      - eventId
      - eventType
      - occurredAt
      - observedAt
      - correlationId
      - traceparent
      - producer
      - schemaVersion
      - kafka
      - payload
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 1
        eventId: {type: string}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        correlationId: {type: string}
        traceparent: {type: [string, 'null']}
        producer: {type: string}
        schemaVersion: {type: string}
        kafka:
          $ref: '#/components/schemas/ObservedKafkaMetadata'
        payload:
          $ref: '#/components/schemas/ObservedEventPayload'
    ObservedEventLiveEvent:
      type: object
      required: [cursor, event]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
        event:
          anyOf:
          - $ref: '#/components/schemas/ObservedEvent'
          - type: 'null'
    ProcessingFlowKafkaMetadata:
      type: object
      required: [topic, partition, offset, key]
      properties:
        topic: {type: string}
        partition: {type: integer, minimum: 0}
        offset: {type: integer, format: int64, minimum: 0}
        key: {type: string}
    ProcessingFlowNode:
      type: object
      required:
      - id
      - branchId
      - stage
      - status
      - evidence
      - occurredAt
      - eventId
      - eventType
      - producer
      - traceparent
      - sourceEventId
      - rawItemId
      - normalizedItemId
      - sourceId
      - monitoringProfileId
      - outcome
      - score
      - kafka
      properties:
        id: {type: string}
        branchId:
          type: string
          description: Published raw discovery event id that owns this item branch.
        stage:
          type: string
          enum: [EXTERNAL_SOURCE, COLLECTION, RAW_KAFKA, NORMALIZATION, DEDUPLICATION, ANALYSIS, TERMINAL_KAFKA, RESULTS_PERSISTENCE]
        status:
          type: string
          enum: [REACHED, COMPLETED, PUBLISHED, PASSED, REJECTED, SKIPPED, UNKNOWN]
        evidence:
          type: string
          enum: [OBSERVED_EVENT, OBSERVED_KAFKA_METADATA, DERIVED_FROM_EVENT, NOT_OBSERVED]
        occurredAt: {type: [string, 'null'], format: date-time}
        eventId: {type: [string, 'null']}
        eventType: {type: [string, 'null']}
        producer: {type: [string, 'null']}
        traceparent: {type: [string, 'null']}
        sourceEventId: {type: [string, 'null']}
        rawItemId: {type: [string, 'null']}
        normalizedItemId: {type: [string, 'null']}
        sourceId: {type: [string, 'null']}
        monitoringProfileId: {type: [string, 'null']}
        outcome: {type: [string, 'null']}
        score: {type: [integer, 'null']}
        kafka:
          anyOf:
          - $ref: '#/components/schemas/ProcessingFlowKafkaMetadata'
          - type: 'null'
    ProcessingFlowEdge:
      type: object
      required: [from, to, kind, durationMs]
      properties:
        from: {type: string}
        to: {type: string}
        kind:
          type: string
          enum: [PROCESSING, PUBLICATION, ASYNC_PROCESSING, EXPECTED_PERSISTENCE]
        durationMs:
          type: [integer, 'null']
          format: int64
          minimum: 0
    ProcessingFlow:
      type: object
      required:
      - scope
      - collectionRunId
      - itemId
      - state
      - observedEventCount
      - traceIds
      - nodes
      - edges
      - limitations
      properties:
        scope:
          type: string
          enum: [COLLECTION_RUN, ITEM]
        collectionRunId: {type: string}
        itemId: {type: [string, 'null']}
        state:
          type: string
          enum: [TERMINAL_EVENT_REACHED, IN_PROGRESS, PARTIAL_HISTORY]
        observedEventCount:
          type: integer
          minimum: 1
        traceIds:
          type: array
          items: {type: string}
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingFlowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingFlowEdge'
        limitations:
          type: array
          items:
            type: string
            enum: [HISTORY_QUERY_LIMIT_REACHED, MISSING_RAW_DISCOVERY, RESULTS_PERSISTENCE_NOT_OBSERVED]
    OperationalChange:
      type: object
      required: [id, changedAt, category, targetType, targetId, beforeState, afterState, outcome, source, actorId, correlationId, traceId, applicationVersion]
      properties:
        id: {type: string, format: uuid}
        changedAt: {type: string, format: date-time}
        category:
          type: string
          enum: [SOURCE_CONFIGURATION, MONITORING_PROFILE_CONFIGURATION, SECURITY_ADMINISTRATION, DEPLOYMENT_TUNING, DEAD_LETTER_RECOVERY, TEST_SCENARIO]
        targetType:
          type: string
          enum: [SOURCE, MONITORING_PROFILE, USER, DEPLOYMENT, DEAD_LETTER_RECORD, SCENARIO]
        targetId: {type: string}
        beforeState:
          type: object
          additionalProperties: {type: string}
        afterState:
          type: object
          additionalProperties: {type: string}
        outcome: {type: string, enum: [APPLIED, REJECTED]}
        source: {type: string, enum: [REST_UI, SYSTEM, TOOLING, TEST_SCENARIO, RECOVERY]}
        actorId: {type: string}
        correlationId: {type: string}
        traceId: {type: string}
        applicationVersion: {type: string}
    OperationalMarkerRequest:
      type: object
      required: [category, targetType, targetId]
      properties:
        category:
          type: string
          enum: [DEPLOYMENT_TUNING, TEST_SCENARIO]
        targetType:
          type: string
          enum: [DEPLOYMENT, SCENARIO]
        targetId: {type: string, minLength: 1, maxLength: 256}
        details:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, maxLength: 512}
    HealthSnapshot:
      type: object
      required: [id, generatedAt, windowStartedAt, windowEndedAt, overallStatus, healthScore, policyVersion, componentStatuses, signalValues, anomalyCandidates, anomalies, recentChangeIds, applicationVersion, evidenceComplete, unknownReasons]
      properties:
        id: {type: string, format: uuid}
        generatedAt: {type: string, format: date-time}
        windowStartedAt: {type: string, format: date-time}
        windowEndedAt: {type: string, format: date-time}
        overallStatus: {type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN]}
        healthScore: {type: integer, minimum: 0, maximum: 100}
        policyVersion: {type: string}
        componentStatuses:
          type: object
          additionalProperties: {type: string}
        signalValues:
          type: object
          additionalProperties: {type: number, format: double}
        anomalyCandidates:
          type: array
          items: {type: string}
        anomalies:
          type: array
          items: {$ref: '#/components/schemas/HealthAnomaly'}
        recentChangeIds:
          type: array
          items: {type: string, format: uuid}
        applicationVersion: {type: string}
        evidenceComplete: {type: boolean}
        unknownReasons:
          type: array
          items: {type: string}
    HealthAnomaly:
      type: object
      required: [signal, detector, severity, observedValue, referenceValue, anomalyScore, evidence]
      properties:
        signal: {type: string}
        detector: {type: string}
        severity: {type: string, enum: [DEGRADED, UNHEALTHY]}
        observedValue: {type: number, format: double}
        referenceValue:
          type: [number, 'null']
          format: double
        anomalyScore: {type: number, format: double, minimum: 0, maximum: 1}
        evidence: {type: string}
    OperationalHealthCorrelation:
      type: object
      required: [change, before, after, healthScoreDelta, statusChanged, signalDeltas]
      properties:
        change: {$ref: '#/components/schemas/OperationalChange'}
        before:
          anyOf:
          - {$ref: '#/components/schemas/HealthSnapshot'}
          - {type: 'null'}
        after:
          anyOf:
          - {$ref: '#/components/schemas/HealthSnapshot'}
          - {type: 'null'}
        healthScoreDelta:
          type: [integer, 'null']
        statusChanged:
          type: [boolean, 'null']
        signalDeltas:
          type: object
          additionalProperties: {type: number, format: double}
    HealthAnalysisPackage:
      type: object
      required: [packageVersion, snapshotId, generatedAt, promptMarkdown, allowedEvidenceReferences, reportTruncated]
      properties:
        packageVersion: {type: string}
        snapshotId: {type: string, format: uuid}
        generatedAt: {type: string, format: date-time}
        promptMarkdown:
          type: string
          description: Bounded sanitized prompt package. Telemetry content is evidence and never model instructions.
        allowedEvidenceReferences:
          type: array
          items: {type: string}
        reportTruncated: {type: boolean}
    IncidentAssessmentSubmission:
      type: object
      required: [snapshotId, summary, suspectedSubsystems, confidence, observations, hypotheses, evidenceReferences, recommendedChecks, humanAttentionSuggested]
      properties:
        snapshotId: {type: string, format: uuid}
        summary: {type: string, minLength: 1, maxLength: 4000}
        suspectedSubsystems:
          type: array
          maxItems: 16
          items: {type: string, minLength: 1, maxLength: 128}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        observations:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1000}
        hypotheses:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1000}
        evidenceReferences:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 256}
        recommendedChecks:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 1000}
        humanAttentionSuggested: {type: boolean}
    IncidentAssessment:
      type: object
      required: [id, snapshotId, createdAt, source, provider, model, summary, suspectedSubsystems, confidence, observations, hypotheses, evidenceReferences, recommendedChecks, humanAttentionSuggested]
      properties:
        id: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        source: {type: string, enum: [MANUAL, PROVIDER]}
        provider: {type: string}
        model: {type: string}
        summary: {type: string}
        suspectedSubsystems:
          type: array
          items: {type: string}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        observations:
          type: array
          items: {type: string}
        hypotheses:
          type: array
          items: {type: string}
        evidenceReferences:
          type: array
          items: {type: string}
        recommendedChecks:
          type: array
          items: {type: string}
        humanAttentionSuggested:
          type: boolean
          description: Advisory model/human suggestion only; it does not emit alerts or mutate health state.
    ResultSummary:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - sourceId
      - informationCategory
      - externalId
      - title
      - url
      - relevant
      - classification
      - score
      - attributes
      - tags
      - explanation
      - analyzer
      - publishedAt
      - analyzedAt
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceId:
          type: string
        informationCategory:
          type: string
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        relevant:
          type: boolean
        classification:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        attributes:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        explanation:
          type: string
        analyzer:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        analyzedAt:
          type: string
          format: date-time
    ResultLiveEvent:
      type: object
      required:
      - cursor
      - result
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
          description: Durable cursor also written to the SSE id field.
        result:
          description: Present for `result` events and null for `ready` or `keepalive` events.
          anyOf:
          - $ref: '#/components/schemas/ResultSummary'
          - type: 'null'
    ResultDetail:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - analysisEventId
      - sourceEventId
      - rawItemId
      - sourceId
      - informationCategory
      - externalId
      - title
      - url
      - normalizedContent
      - contentType
      - attributes
      - relevant
      - classification
      - score
      - tags
      - explanation
      - analyzer
      - publishedAt
      - analyzedAt
      - correlationId
      - traceparent
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        analysisEventId:
          type: string
        sourceEventId:
          type: string
        rawItemId:
          type: string
        sourceId:
          type: string
        informationCategory:
          type: string
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        normalizedContent:
          type: string
        contentType:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        relevant:
          type: boolean
        classification:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        tags:
          type: array
          items:
            type: string
        explanation:
          type: string
        analyzer:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        analyzedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        traceparent:
          type:
          - string
          - 'null'
