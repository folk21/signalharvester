openapi: 3.1.0
info:
  title: SignalHarvester Backend API
  version: 0.1.0
  description: Public HTTP contract for SignalHarvester configuration, results, event observation, processing-flow, and operational
    APIs.
tags:
- name: Sources
  description: External source configuration.
- name: Monitoring Profiles
  description: Persisted monitoring-profile configuration.
- name: Collection Runs
  description: Manual collection execution and operational run history.
- name: Analysis Inspection
  description: Read-only operational inspection of analysis deduplication state.
- name: Results
  description: Read-only browsing of durable analyzed results.
- name: Event Observation
  description: Bounded technical event history and live Event Explorer delivery.
- name: Processing Flows
  description: Reconstructed collection-run and item processing graphs for the Event Explorer.
- name: Authentication
  description: Stateless JWT browser authentication and current-principal inspection.
- name: User Administration
  description: ADMIN-only persistent identity and role administration.
security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/v1/sources:
    get:
      tags:
      - Sources
      operationId: listSources
      summary: List configured external sources
      responses:
        '200':
          description: Configured sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      tags:
      - Sources
      operationId: createSource
      summary: Create an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
  /api/v1/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Sources
      operationId: getSource
      summary: Get a configured external source
      responses:
        '200':
          description: Configured source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Source not found
    put:
      tags:
      - Sources
      operationId: updateSource
      summary: Replace an external source configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
        '404':
          description: Source not found
    delete:
      tags:
      - Sources
      operationId: deleteSource
      summary: Delete an external source
      responses:
        '204':
          description: Source deleted
        '404':
          description: Source not found
        '409':
          description: Source is referenced by a monitoring profile
  /api/v1/sources/{sourceId}/test:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    post:
      tags:
      - Sources
      operationId: testSource
      summary: Test one persisted external source configuration
      description: Uses the normal collection fetch and extraction boundary without publishing Kafka events or collection-run history. Disabled sources may be tested before activation.
      responses:
        '200':
          description: Diagnostic source-test result, including fetch or extraction failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTestResult'
        '404':
          description: Source not found
  /api/v1/monitoring-profiles:
    get:
      tags:
      - Monitoring Profiles
      operationId: listMonitoringProfiles
      summary: List monitoring profiles
      responses:
        '200':
          description: Persisted monitoring profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringProfile'
    post:
      tags:
      - Monitoring Profiles
      operationId: createMonitoringProfile
      summary: Create a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '201':
          description: Monitoring profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
  /api/v1/monitoring-profiles/{profileId}:
    parameters:
    - name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Monitoring Profiles
      operationId: getMonitoringProfile
      summary: Get a monitoring profile
      responses:
        '200':
          description: Persisted monitoring profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '404':
          description: Monitoring profile not found
    put:
      tags:
      - Monitoring Profiles
      operationId: updateMonitoringProfile
      summary: Replace a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '200':
          description: Monitoring profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
        '404':
          description: Monitoring profile not found
    delete:
      tags:
      - Monitoring Profiles
      operationId: deleteMonitoringProfile
      summary: Delete a monitoring profile
      responses:
        '204':
          description: Monitoring profile deleted
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs:
    get:
      tags:
      - Collection Runs
      operationId: listCollectionRuns
      summary: List recent completed collection runs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Recent collection runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionRun'
    post:
      tags:
      - Collection Runs
      operationId: startCollectionRun
      summary: Start a manual collection run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRunRequest'
      responses:
        '201':
          description: Completed collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '400':
          description: Invalid run request
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs/{collectionRunId}:
    parameters:
    - name: collectionRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Collection Runs
      operationId: getCollectionRun
      summary: Get one completed collection run
      responses:
        '200':
          description: Collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '404':
          description: Collection run not found
  /api/v1/admin/analysis/items:
    get:
      tags:
      - Analysis Inspection
      operationId: listAnalysisItems
      summary: List recent normalized analysis items
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisItemInspection'
  /api/v1/admin/analysis/items/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Analysis Inspection
      operationId: getAnalysisItem
      summary: Get one profile-scoped normalized analysis item
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisItemInspection'
        '404':
          description: Analysis item not found
  /api/v1/events:
    get:
      tags:
      - Event Observation
      operationId: listObservedEvents
      summary: List recent technical processing events
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: eventType
        in: query
        schema:
          type: string
      - name: producer
        in: query
        schema:
          type: string
      - name: topic
        in: query
        schema:
          type: string
      - name: correlationId
        in: query
        schema:
          type: string
      - name: collectionRunId
        in: query
        description: Alias for the current pipeline correlation identifier.
        schema:
          type: string
      - name: itemId
        in: query
        description: Matches either rawItemId or normalizedItemId.
        schema:
          type: string
      - name: traceId
        in: query
        description: W3C trace id matched inside traceparent when present.
        schema:
          type: string
      responses:
        '200':
          description: Recent observed events matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservedEvent'
        '400':
          description: Invalid event-observation query parameters
  /api/v1/events/stream:
    get:
      tags:
      - Event Observation
      operationId: streamObservedEvents
      summary: Stream live technical processing events
      description: >-
        Server-Sent Events stream over the bounded persisted Event Explorer history. The server emits
        named `ready`, `event`, and `keepalive` events with numeric durable cursors. Browser reconnection
        may resume with Last-Event-ID. A fresh connection starts after the current cursor; use
        GET /api/v1/events for an initial bounded history snapshot. For a race-free browser bootstrap,
        establish the stream and receive `ready` before fetching GET /api/v1/events, buffering later `event`
        messages until the REST snapshot has been applied. History retention is bounded, so a reconnect
        cursor older than retained records resumes with the oldest still-retained matching events.
      parameters:
      - name: eventType
        in: query
        schema:
          type: string
      - name: producer
        in: query
        schema:
          type: string
      - name: topic
        in: query
        schema:
          type: string
      - name: correlationId
        in: query
        schema:
          type: string
      - name: collectionRunId
        in: query
        schema:
          type: string
      - name: itemId
        in: query
        schema:
          type: string
      - name: traceId
        in: query
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resumable live technical-event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ObservedEventLiveEvent'
        '400':
          description: Invalid filters or Last-Event-ID cursor
  /api/v1/flows/collection-runs/{collectionRunId}:
    get:
      tags:
      - Processing Flows
      operationId: getCollectionRunProcessingFlow
      summary: Reconstruct a processing graph for one collection run
      description: >-
        Builds a bounded diagnostic graph from retained Event Observation history. Each node states whether
        its evidence is directly observed, derived from a published event, or currently not observed.
      parameters:
      - name: collectionRunId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Reconstructed collection-run processing graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingFlow'
        '404':
          description: No retained technical events exist for the collection run
  /api/v1/flows/collection-runs/{collectionRunId}/items/{itemId}:
    get:
      tags:
      - Processing Flows
      operationId: getItemProcessingFlow
      summary: Reconstruct one item branch within a collection run
      description: >-
        The item identifier may be a raw or normalized item id. Collection-run scoping prevents repeated
        logical items from different runs from being merged into one graph.
      parameters:
      - name: collectionRunId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Reconstructed item processing graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingFlow'
        '404':
          description: No retained technical events exist for the selected item in the collection run
  /api/v1/results:
    get:
      tags:
      - Results
      operationId: listResults
      summary: List recent analyzed results
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      - name: informationCategory
        in: query
        schema:
          type: string
      - name: relevant
        in: query
        schema:
          type: boolean
      - name: classification
        in: query
        schema:
          type: string
      - name: analyzedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: analyzedTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Recent analyzed results matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultSummary'
        '400':
          description: Invalid result query parameters
  /api/v1/results/stream:
    get:
      tags:
      - Results
      operationId: streamResults
      summary: Stream live analyzed-result updates
      description: >-
        Server-Sent Events stream. The server emits named `ready`, `result`, and `keepalive`
        events. Each event has a numeric `id` cursor and a JSON `data` payload matching
        ResultLiveEvent. Browser EventSource reconnection resumes from the automatically
        supplied Last-Event-ID header. A connection without Last-Event-ID starts after the
        current durable cursor; clients should use GET /api/v1/results for initial browsing.
        The stream represents current result projections rather than an append-only event history,
        so repeated updates to one logical result while disconnected may collapse to the latest
        current projection. A resume cursor ahead of the current database watermark is normalized
        back to that watermark. For a race-free initial page load, establish the stream and receive
        `ready` before fetching GET /api/v1/results, buffering later `result` events until the REST
        snapshot has been applied.
      parameters:
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      - name: informationCategory
        in: query
        schema:
          type: string
      - name: relevant
        in: query
        schema:
          type: boolean
      - name: classification
        in: query
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        required: false
        description: Last numeric SSE cursor received by the client.
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Resumable live result stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ResultLiveEvent'
        '400':
          description: Invalid filters or Last-Event-ID cursor
  /api/v1/results/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Results
      operationId: getResult
      summary: Get one profile-scoped analyzed result
      responses:
        '200':
          description: Detailed analyzed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDetail'
        '400':
          description: Invalid result identity
        '404':
          description: Result not found
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate with username and password
      description: On success the backend sets an HttpOnly JWT cookie and a readable signed CSRF cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded and browser credentials were set
        '401':
          description: Invalid credentials or disabled account
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Clear browser authentication credentials
      responses:
        '200':
          description: Browser authentication cookie cleared
        '401':
          description: Authentication required
        '403':
          description: CSRF validation failed
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentPrincipal
      summary: Get the current authenticated principal
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPrincipal'
        '401':
          description: Authentication required
  /api/v1/admin/users:
    get:
      tags:
      - User Administration
      operationId: listUsers
      summary: List persisted application identities
      responses:
        '200':
          description: Persisted identities without credential material
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
    post:
      tags:
      - User Administration
      operationId: createUser
      summary: Create an application identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Identity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid identity configuration
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required or CSRF validation failed
        '409':
          description: Username already exists
  /api/v1/admin/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - User Administration
      operationId: getUser
      summary: Get one persisted application identity
      responses:
        '200':
          description: Persisted identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Identity not found
    put:
      tags:
      - User Administration
      operationId: updateUser
      summary: Replace identity enabled state and role assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Identity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid identity configuration
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required or CSRF validation failed
        '404':
          description: Identity not found
        '409':
          description: Update would leave the deployment without an enabled ADMIN identity
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SIGNALHARVESTER_AUTH
      description: HttpOnly JWT cookie used by browser REST and native EventSource requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer transport for approved non-browser clients.
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Stable source identifier.
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    UserRole:
      type: string
      enum: [USER, VIEWER, ADMIN, BOT]
    IdentityType:
      type: string
      enum: [HUMAN, BOT]
    CurrentPrincipal:
      type: object
      required: [id, username, identityType, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        identityType:
          $ref: '#/components/schemas/IdentityType'
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
    UserAccount:
      type: object
      required: [id, username, identityType, enabled, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        identityType:
          $ref: '#/components/schemas/IdentityType'
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [username, password, identityType, enabled]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        identityType:
          $ref: '#/components/schemas/IdentityType'
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/UserRole'
    UserUpdateRequest:
      type: object
      required: [enabled, roles]
      properties:
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
    SourceType:
      type: string
      enum:
      - REST
      - RSS
      - HTML
    Source:
      type: object
      required:
      - id
      - name
      - type
      - location
      - enabled
      - settings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
        settings:
          type: object
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceUpsertRequest:
      type: object
      required:
      - name
      - type
      - location
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
          default: false
          description: Whether collection is enabled. Omitted requests default to false.
        settings:
          type: object
          default: {}
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceTestStatus:
      type: string
      enum:
      - SUCCEEDED
      - FETCH_FAILED
      - EXTRACTION_FAILED
    SourceTestPreviewItem:
      type: object
      required:
      - externalId
      - title
      - url
      - contentPreview
      - contentType
      - publishedAt
      - contentTruncated
      properties:
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        contentPreview:
          type: string
          description: Bounded prefix of extracted semantic content.
        contentType:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        contentTruncated:
          type: boolean
    SourceTestResult:
      type: object
      required:
      - sourceId
      - status
      - httpStatus
      - responseContentType
      - responseBytes
      - fetchDurationMs
      - extractionDurationMs
      - candidateItemCount
      - preview
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SourceTestStatus'
        httpStatus:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        responseContentType:
          type:
          - string
          - 'null'
        responseBytes:
          type: integer
          minimum: 0
        fetchDurationMs:
          type: integer
          format: int64
          minimum: 0
        extractionDurationMs:
          type: integer
          format: int64
          minimum: 0
        candidateItemCount:
          type: integer
          minimum: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/SourceTestPreviewItem'
        failureMessage:
          type:
          - string
          - 'null'
    MonitoringProfile:
      type: object
      required:
      - id
      - name
      - informationCategory
      - enabled
      - collectionIntervalMinutes
      - sourceIds
      - criteria
      - analysisSettings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          additionalProperties:
            type: string
        analysisSettings:
          $ref: '#/components/schemas/MonitoringProfileAnalysisSettings'
    MonitoringProfileUpsertRequest:
      type: object
      required:
      - name
      - informationCategory
      - collectionIntervalMinutes
      - sourceIds
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
          default: false
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          default: {}
          additionalProperties:
            type: string
        analysisSettings:
          description: Optional compatibility bridge. Create omission uses deployment defaults; update omission preserves the current effective settings. New clients should round-trip this field.
          $ref: '#/components/schemas/MonitoringProfileAnalysisSettings'
    MonitoringProfileAnalysisSettings:
      type: object
      required:
      - keywords
      - minimumMatches
      properties:
        keywords:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: .*\S.*
        minimumMatches:
          type: integer
          minimum: 1
          description: Must not exceed the number of unique normalized keywords.
    CollectionRunRequest:
      type: object
      required:
      - monitoringProfileId
      properties:
        monitoringProfileId:
          type: string
          format: uuid
    CollectionSourceRun:
      type: object
      description: One terminal source/item outcome. RSS/Atom sources may contribute multiple outcomes with the same sourceId.
      required:
      - sourceId
      - status
      - rawItemId
      - eventId
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PUBLISHED
          - NO_ITEMS
          - FETCH_FAILED
          - EXTRACTION_FAILED
          - PUBLICATION_FAILED
        rawItemId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        failureMessage:
          type:
          - string
          - 'null'
    CollectionRun:
      type: object
      required:
      - collectionRunId
      - monitoringProfileId
      - informationCategory
      - startedAt
      - finishedAt
      - status
      - publishedCount
      - failedCount
      - sources
      properties:
        collectionRunId:
          type: string
          format: uuid
        monitoringProfileId:
          type: string
        informationCategory:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
        publishedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of semantic items successfully published to Kafka.
        failedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of fetch, extraction, or item-publication failures.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSourceRun'
    AnalysisItemInspection:
