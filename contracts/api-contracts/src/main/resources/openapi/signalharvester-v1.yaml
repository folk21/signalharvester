openapi: 3.1.0
info:
  title: SignalHarvester Backend API
  version: 0.1.0
  description: Public HTTP contract for SignalHarvester configuration, results, and operational
    APIs.
tags:
- name: Sources
  description: External source configuration.
- name: Monitoring Profiles
  description: Persisted monitoring-profile configuration.
- name: Collection Runs
  description: Manual collection execution and operational run history.
- name: Analysis Inspection
  description: Read-only operational inspection of analysis deduplication state.
- name: Results
  description: Read-only browsing of durable analyzed results.
paths:
  /api/v1/sources:
    get:
      tags:
      - Sources
      operationId: listSources
      summary: List configured external sources
      responses:
        '200':
          description: Configured sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      tags:
      - Sources
      operationId: createSource
      summary: Create an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
  /api/v1/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Sources
      operationId: getSource
      summary: Get a configured external source
      responses:
        '200':
          description: Configured source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Source not found
    put:
      tags:
      - Sources
      operationId: updateSource
      summary: Replace an external source configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
        '404':
          description: Source not found
    delete:
      tags:
      - Sources
      operationId: deleteSource
      summary: Delete an external source
      responses:
        '204':
          description: Source deleted
        '404':
          description: Source not found
        '409':
          description: Source is referenced by a monitoring profile
  /api/v1/sources/{sourceId}/test:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    post:
      tags:
      - Sources
      operationId: testSource
      summary: Test one persisted external source configuration
      description: Uses the normal collection fetch and extraction boundary without publishing Kafka events or collection-run history. Disabled sources may be tested before activation.
      responses:
        '200':
          description: Diagnostic source-test result, including fetch or extraction failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTestResult'
        '404':
          description: Source not found
  /api/v1/monitoring-profiles:
    get:
      tags:
      - Monitoring Profiles
      operationId: listMonitoringProfiles
      summary: List monitoring profiles
      responses:
        '200':
          description: Persisted monitoring profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonitoringProfile'
    post:
      tags:
      - Monitoring Profiles
      operationId: createMonitoringProfile
      summary: Create a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '201':
          description: Monitoring profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
  /api/v1/monitoring-profiles/{profileId}:
    parameters:
    - name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Monitoring Profiles
      operationId: getMonitoringProfile
      summary: Get a monitoring profile
      responses:
        '200':
          description: Persisted monitoring profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '404':
          description: Monitoring profile not found
    put:
      tags:
      - Monitoring Profiles
      operationId: updateMonitoringProfile
      summary: Replace a monitoring profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringProfileUpsertRequest'
      responses:
        '200':
          description: Monitoring profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringProfile'
        '400':
          description: Invalid monitoring profile configuration
        '404':
          description: Monitoring profile not found
    delete:
      tags:
      - Monitoring Profiles
      operationId: deleteMonitoringProfile
      summary: Delete a monitoring profile
      responses:
        '204':
          description: Monitoring profile deleted
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs:
    get:
      tags:
      - Collection Runs
      operationId: listCollectionRuns
      summary: List recent completed collection runs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Recent collection runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionRun'
    post:
      tags:
      - Collection Runs
      operationId: startCollectionRun
      summary: Start a manual collection run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRunRequest'
      responses:
        '201':
          description: Completed collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '400':
          description: Invalid run request
        '404':
          description: Monitoring profile not found
  /api/v1/admin/collection-runs/{collectionRunId}:
    parameters:
    - name: collectionRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Collection Runs
      operationId: getCollectionRun
      summary: Get one completed collection run
      responses:
        '200':
          description: Collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '404':
          description: Collection run not found
  /api/v1/admin/analysis/items:
    get:
      tags:
      - Analysis Inspection
      operationId: listAnalysisItems
      summary: List recent normalized analysis items
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisItemInspection'
  /api/v1/admin/analysis/items/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Analysis Inspection
      operationId: getAnalysisItem
      summary: Get one profile-scoped normalized analysis item
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisItemInspection'
        '404':
          description: Analysis item not found
  /api/v1/results:
    get:
      tags:
      - Results
      operationId: listResults
      summary: List recent analyzed results
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      - name: informationCategory
        in: query
        schema:
          type: string
      - name: relevant
        in: query
        schema:
          type: boolean
      - name: classification
        in: query
        schema:
          type: string
      - name: analyzedFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: analyzedTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Recent analyzed results matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultSummary'
        '400':
          description: Invalid result query parameters
  /api/v1/results/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Results
      operationId: getResult
      summary: Get one profile-scoped analyzed result
      responses:
        '200':
          description: Detailed analyzed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDetail'
        '400':
          description: Invalid result identity
        '404':
          description: Result not found
components:
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Stable source identifier.
      schema:
        type: string
        format: uuid
  schemas:
    SourceType:
      type: string
      enum:
      - REST
      - RSS
      - HTML
    Source:
      type: object
      required:
      - id
      - name
      - type
      - location
      - enabled
      - settings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
        settings:
          type: object
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceUpsertRequest:
      type: object
      required:
      - name
      - type
      - location
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
          default: false
          description: Whether collection is enabled. Omitted requests default to false.
        settings:
          type: object
          default: {}
          description: Source-type-specific string configuration interpreted by the owning collector. REST JSON extraction uses json.* JSON Pointer settings; HTML extraction uses html.* CSS selector settings.
          additionalProperties:
            type: string
    SourceTestStatus:
      type: string
      enum:
      - SUCCEEDED
      - FETCH_FAILED
      - EXTRACTION_FAILED
    SourceTestPreviewItem:
      type: object
      required:
      - externalId
      - title
      - url
      - contentPreview
      - contentType
      - publishedAt
      - contentTruncated
      properties:
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        contentPreview:
          type: string
          description: Bounded prefix of extracted semantic content.
        contentType:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        contentTruncated:
          type: boolean
    SourceTestResult:
      type: object
      required:
      - sourceId
      - status
      - httpStatus
      - responseContentType
      - responseBytes
      - fetchDurationMs
      - extractionDurationMs
      - candidateItemCount
      - preview
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SourceTestStatus'
        httpStatus:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 599
        responseContentType:
          type:
          - string
          - 'null'
        responseBytes:
          type: integer
          minimum: 0
        fetchDurationMs:
          type: integer
          format: int64
          minimum: 0
        extractionDurationMs:
          type: integer
          format: int64
          minimum: 0
        candidateItemCount:
          type: integer
          minimum: 0
        preview:
          type: array
          items:
            $ref: '#/components/schemas/SourceTestPreviewItem'
        failureMessage:
          type:
          - string
          - 'null'
    MonitoringProfile:
      type: object
      required:
      - id
      - name
      - informationCategory
      - enabled
      - collectionIntervalMinutes
      - sourceIds
      - criteria
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          additionalProperties:
            type: string
    MonitoringProfileUpsertRequest:
      type: object
      required:
      - name
      - informationCategory
      - collectionIntervalMinutes
      - sourceIds
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
        enabled:
          type: boolean
          default: false
        collectionIntervalMinutes:
          type: integer
          minimum: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        criteria:
          type: object
          default: {}
          additionalProperties:
            type: string
    CollectionRunRequest:
      type: object
      required:
      - monitoringProfileId
      properties:
        monitoringProfileId:
          type: string
          format: uuid
    CollectionSourceRun:
      type: object
      description: One terminal source/item outcome. RSS/Atom sources may contribute multiple outcomes with the same sourceId.
      required:
      - sourceId
      - status
      - rawItemId
      - eventId
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PUBLISHED
          - NO_ITEMS
          - FETCH_FAILED
          - EXTRACTION_FAILED
          - PUBLICATION_FAILED
        rawItemId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        failureMessage:
          type:
          - string
          - 'null'
    CollectionRun:
      type: object
      required:
      - collectionRunId
      - monitoringProfileId
      - informationCategory
      - startedAt
      - finishedAt
      - status
      - publishedCount
      - failedCount
      - sources
      properties:
        collectionRunId:
          type: string
          format: uuid
        monitoringProfileId:
          type: string
        informationCategory:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
        publishedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of semantic items successfully published to Kafka.
        failedCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of fetch, extraction, or item-publication failures.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSourceRun'
    AnalysisItemInspection:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - sourceId
      - externalId
      - sourceUrl
      - firstRawItemId
      - firstSourceEventId
      - firstSeenAt
      - lastRawItemId
      - lastSourceEventId
      - lastSeenAt
      - discoveryCount
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceId:
          type: string
        externalId:
          type:
          - string
          - 'null'
        sourceUrl:
          type: string
          format: uri
        firstRawItemId:
          type: string
        firstSourceEventId:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastRawItemId:
          type: string
        lastSourceEventId:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        discoveryCount:
          type: integer
          format: int64
          minimum: 1

    ResultSummary:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - sourceId
      - informationCategory
      - externalId
      - title
      - url
      - relevant
      - classification
      - score
      - attributes
      - tags
      - explanation
      - analyzer
      - publishedAt
      - analyzedAt
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceId:
          type: string
        informationCategory:
          type: string
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        relevant:
          type: boolean
        classification:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        attributes:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        explanation:
          type: string
        analyzer:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        analyzedAt:
          type: string
          format: date-time
    ResultDetail:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - analysisEventId
      - sourceEventId
      - rawItemId
      - sourceId
      - informationCategory
      - externalId
      - title
      - url
      - normalizedContent
      - contentType
      - attributes
      - relevant
      - classification
      - score
      - tags
      - explanation
      - analyzer
      - publishedAt
      - analyzedAt
      - correlationId
      - traceparent
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        analysisEventId:
          type: string
        sourceEventId:
          type: string
        rawItemId:
          type: string
        sourceId:
          type: string
        informationCategory:
          type: string
        externalId:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        normalizedContent:
          type: string
        contentType:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        relevant:
          type: boolean
        classification:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        tags:
          type: array
          items:
            type: string
        explanation:
          type: string
        analyzer:
          type: string
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        analyzedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        traceparent:
          type:
          - string
          - 'null'
