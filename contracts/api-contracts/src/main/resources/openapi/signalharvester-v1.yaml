openapi: 3.1.0
info:
  title: SignalHarvester Backend API
  version: 0.1.0
  description: Public HTTP contract for SignalHarvester configuration and operational
    APIs.
tags:
- name: Sources
  description: External source configuration.
- name: Collection Runs
  description: Manual collection execution and operational run history.
- name: Analysis Inspection
  description: Read-only operational inspection of analysis deduplication state.
paths:
  /api/v1/sources:
    get:
      tags:
      - Sources
      operationId: listSources
      summary: List configured external sources
      responses:
        '200':
          description: Configured sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      tags:
      - Sources
      operationId: createSource
      summary: Create an external source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
  /api/v1/sources/{sourceId}:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    get:
      tags:
      - Sources
      operationId: getSource
      summary: Get a configured external source
      responses:
        '200':
          description: Configured source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Source not found
    put:
      tags:
      - Sources
      operationId: updateSource
      summary: Replace an external source configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpsertRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Invalid source configuration
        '404':
          description: Source not found
    delete:
      tags:
      - Sources
      operationId: deleteSource
      summary: Delete an external source
      responses:
        '204':
          description: Source deleted
        '404':
          description: Source not found
  /api/v1/admin/collection-runs:
    get:
      tags:
      - Collection Runs
      operationId: listCollectionRuns
      summary: List recent completed collection runs
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Recent collection runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionRun'
    post:
      tags:
      - Collection Runs
      operationId: startCollectionRun
      summary: Start a manual collection run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRunRequest'
      responses:
        '201':
          description: Completed collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '400':
          description: Invalid run request
  /api/v1/admin/collection-runs/{collectionRunId}:
    parameters:
    - name: collectionRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Collection Runs
      operationId: getCollectionRun
      summary: Get one completed collection run
      responses:
        '200':
          description: Collection run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRun'
        '404':
          description: Collection run not found
  /api/v1/admin/analysis/items:
    get:
      tags:
      - Analysis Inspection
      operationId: listAnalysisItems
      summary: List recent normalized analysis items
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: monitoringProfileId
        in: query
        schema:
          type: string
      - name: sourceId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisItemInspection'
  /api/v1/admin/analysis/items/{normalizedItemId}:
    parameters:
    - name: normalizedItemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    - name: monitoringProfileId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    get:
      tags:
      - Analysis Inspection
      operationId: getAnalysisItem
      summary: Get one profile-scoped normalized analysis item
      responses:
        '200':
          description: Analysis item inspection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisItemInspection'
        '404':
          description: Analysis item not found
components:
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      description: Stable source identifier.
      schema:
        type: string
        format: uuid
  schemas:
    SourceType:
      type: string
      enum:
      - REST
      - RSS
      - HTML
    Source:
      type: object
      required:
      - id
      - name
      - type
      - location
      - enabled
      - settings
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
        settings:
          type: object
          description: Source-type-specific string configuration interpreted by the
            owning collector.
          additionalProperties:
            type: string
    SourceUpsertRequest:
      type: object
      required:
      - name
      - type
      - location
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*\S.*
        type:
          $ref: '#/components/schemas/SourceType'
        location:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)(?:\[[0-9A-Fa-f:.]+\]|[^/?#:\s]+)(?::\d+)?(?:[/?][^#\s]*)?$
          description: Absolute HTTP(S) source URL without embedded credentials or
            a fragment.
        enabled:
          type: boolean
          default: false
          description: Whether collection is enabled. Omitted requests default to false.
        settings:
          type: object
          default: {}
          description: Source-type-specific string configuration interpreted by the
            owning collector.
          additionalProperties:
            type: string
    CollectionRunRequest:
      type: object
      required:
      - monitoringProfileId
      - informationCategory
      properties:
        monitoringProfileId:
          type: string
          minLength: 1
          pattern: .*\S.*
        informationCategory:
          type: string
          minLength: 1
          pattern: .*\S.*
    CollectionSourceRun:
      type: object
      required:
      - sourceId
      - status
      - rawItemId
      - eventId
      - failureMessage
      properties:
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PUBLISHED
          - FETCH_FAILED
          - PUBLICATION_FAILED
        rawItemId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        failureMessage:
          type:
          - string
          - 'null'
    CollectionRun:
      type: object
      required:
      - collectionRunId
      - monitoringProfileId
      - informationCategory
      - startedAt
      - finishedAt
      - status
      - publishedCount
      - failedCount
      - sources
      properties:
        collectionRunId:
          type: string
          format: uuid
        monitoringProfileId:
          type: string
        informationCategory:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SUCCEEDED
          - PARTIALLY_SUCCEEDED
          - FAILED
        publishedCount:
          type: integer
          format: int64
          minimum: 0
        failedCount:
          type: integer
          format: int64
          minimum: 0
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSourceRun'
    AnalysisItemInspection:
      type: object
      required:
      - monitoringProfileId
      - normalizedItemId
      - sourceId
      - externalId
      - sourceUrl
      - firstRawItemId
      - firstSourceEventId
      - firstSeenAt
      - lastRawItemId
      - lastSourceEventId
      - lastSeenAt
      - discoveryCount
      properties:
        monitoringProfileId:
          type: string
        normalizedItemId:
          type: string
          pattern: ^[0-9a-f]{64}$
        sourceId:
          type: string
        externalId:
          type:
          - string
          - 'null'
        sourceUrl:
          type: string
          format: uri
        firstRawItemId:
          type: string
        firstSourceEventId:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastRawItemId:
          type: string
        lastSourceEventId:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        discoveryCount:
          type: integer
          format: int64
          minimum: 1
