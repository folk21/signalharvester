apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalharvester-backend
  labels:
    app.kubernetes.io/name: signalharvester-backend
    app.kubernetes.io/part-of: signalharvester
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: signalharvester-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalharvester-backend
        app.kubernetes.io/part-of: signalharvester
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: signalharvester-backend
          image: signalharvester-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: signalharvester-backend-config
            - secretRef:
                name: signalharvester-runtime-secrets
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: signalharvester-backend
  labels:
    app.kubernetes.io/name: signalharvester-backend
    app.kubernetes.io/part-of: signalharvester
spec:
  selector:
    app.kubernetes.io/name: signalharvester-backend
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: signalharvester-backend-metrics
  labels:
    app.kubernetes.io/name: signalharvester-backend
    app.kubernetes.io/part-of: signalharvester
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: signalharvester-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
