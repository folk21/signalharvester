apiVersion: v1
kind: ConfigMap
metadata:
  name: signalharvester-resilience-fixture
  namespace: signalharvester
data:
  server.py: |
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    FEEDS = {
        "/baseline.xml": [
            ("baseline-1", "Baseline Java backend", "Java Kafka PostgreSQL backend baseline fixture"),
        ],
        "/lag.xml": [
            ("lag-1", "Lag Java backend 1", "Java Kafka PostgreSQL backend lag fixture 1"),
            ("lag-2", "Lag Java backend 2", "Java Kafka PostgreSQL backend lag fixture 2"),
            ("lag-3", "Lag Java backend 3", "Java Kafka PostgreSQL backend lag fixture 3"),
            ("lag-4", "Lag Java backend 4", "Java Kafka PostgreSQL backend lag fixture 4"),
        ],
        "/outbox.xml": [
            ("outbox-1", "Outbox Java backend 1", "Java Kafka PostgreSQL backend outbox fixture 1"),
            ("outbox-2", "Outbox Java backend 2", "Java Kafka PostgreSQL backend outbox fixture 2"),
            ("outbox-3", "Outbox Java backend 3", "Java Kafka PostgreSQL backend outbox fixture 3"),
        ],
        "/scheduler.xml": [
            ("scheduler-1", "Scheduler Java backend", "Java Kafka PostgreSQL backend scheduler fixture"),
        ],
        "/post-db-recovery.xml": [
            ("post-db-recovery-1", "Post database recovery Java backend", "Java Kafka PostgreSQL backend post database recovery fixture"),
        ],
        "/post-broker-restart.xml": [
            ("post-broker-restart-1", "Broker restart Java backend", "Java Kafka PostgreSQL backend broker restart fixture"),
        ],
        "/slow.xml": [
            ("slow-1", "Slow Java backend", "Java Kafka PostgreSQL backend slow fixture"),
        ],
    }

    def feed_xml(path, entries):
        items = []
        for guid, title, description in entries:
            items.append(
                "<item>"
                f"<guid>{guid}</guid>"
                f"<title>{title}</title>"
                f"<link>http://resilience-fixture:8080/items/{guid}</link>"
                f"<description>{description}</description>"
                "<pubDate>Wed, 16 Sep 2026 18:00:00 GMT</pubDate>"
                "</item>"
            )
        return (
            "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
            "<rss version=\"2.0\"><channel>"
            f"<title>SignalHarvester resilience fixture {path}</title>"
            + "".join(items)
            + "</channel></rss>"
        ).encode("utf-8")

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(b"ok")
                return
            entries = FEEDS.get(path)
            if entries is None:
                self.send_error(404)
                return
            if path == "/slow.xml":
                time.sleep(5)
            body = feed_xml(path, entries)
            self.send_response(200)
            self.send_header("Content-Type", "application/rss+xml; charset=UTF-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalharvester-resilience-fixture
  namespace: signalharvester
  labels:
    app.kubernetes.io/name: signalharvester-resilience-fixture
    app.kubernetes.io/part-of: signalharvester
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signalharvester-resilience-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalharvester-resilience-fixture
        app.kubernetes.io/part-of: signalharvester
    spec:
      containers:
        - name: fixture
          image: python:3.13.7-alpine
          command: ["python", "/fixture/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: fixture
          configMap:
            name: signalharvester-resilience-fixture
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-fixture
  namespace: signalharvester
  labels:
    app.kubernetes.io/name: signalharvester-resilience-fixture
    app.kubernetes.io/part-of: signalharvester
spec:
  selector:
    app.kubernetes.io/name: signalharvester-resilience-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
