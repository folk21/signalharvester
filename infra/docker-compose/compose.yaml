services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalharvester
      POSTGRES_USER: signalharvester
      POSTGRES_PASSWORD: signalharvester
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalharvester -d signalharvester"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - signalharvester-postgres-data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "9092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - signalharvester-redpanda-data:/var/lib/redpanda/data

volumes:
  signalharvester-postgres-data:
  signalharvester-redpanda-data:
