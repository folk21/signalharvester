services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${SIGNALHARVESTER_DB_NAME:-signalharvester}"
      POSTGRES_USER: "${SIGNALHARVESTER_DB_USERNAME:-signalharvester}"
      POSTGRES_PASSWORD: "${SIGNALHARVESTER_DB_PASSWORD:-signalharvester}"
    ports:
      - "${SIGNALHARVESTER_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - signalharvester-postgres-data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://${SIGNALHARVESTER_KAFKA_ADVERTISED_HOST:-localhost}:${SIGNALHARVESTER_KAFKA_PORT:-9092}
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "${SIGNALHARVESTER_KAFKA_PORT:-9092}:19092"
      - "${SIGNALHARVESTER_REDPANDA_ADMIN_PORT:-9644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - signalharvester-redpanda-data:/var/lib/redpanda/data

volumes:
  signalharvester-postgres-data:
  signalharvester-redpanda-data:
