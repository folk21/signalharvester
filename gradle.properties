org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Micronaut Gradle plugins use this property to import the aligned Micronaut Platform BOM.
micronautVersion=4.10.15

# Gradle daemon memory baseline for routine and rare repository verification.
# Rare quality tasks such as dependency analysis can exceed Gradle's 512 MiB default heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
